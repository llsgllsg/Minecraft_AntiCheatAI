name: DeepGuard
version: 1.1.0
main: com.gfish.anticheat.AntiCheatPlugin
api-version: '1.21'
author: Gfish
description: AI-powered anti-cheat with basic movement checks
softdepend: [PlaceholderAPI, Floodgate]
commands:
  anticheat:
    description: DeepGuard admin commands
    aliases: [ac]
    permission: deepguard.admin
permissions:
  deepguard.admin:
    default: op
  deepguard.bypass:
    default: false
libraries:
  - "com.microsoft.onnxruntime:onnxruntime:1.17.1"
