name: 构建 DeepGuard

# 每次 push（任意分支）与 Pull Request 自动构建
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 根 pom 聚合 AntiCheat 与 recorder-plugin，一次构建全部
      - name: 构建全部模块
        run: mvn -B clean package

      - name: 校验产物存在
        run: |
          test -f AntiCheat/target/DeepGuard.jar
          test -f recorder-plugin/target/BehaviorRecorder.jar

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepGuard-build
          path: |
            AntiCheat/target/DeepGuard.jar
            recorder-plugin/target/BehaviorRecorder.jar
          if-no-files-found: error
