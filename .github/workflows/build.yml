name: 构建 DeepGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('AntiCheat/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 构建 AntiCheat
        working-directory: AntiCheat
        run: mvn clean package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepGuard
          path: AntiCheat/target/DeepGuard.jar
