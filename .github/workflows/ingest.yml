name: 导入录制数据

# 把 python/recordings/ 下的原始 jsonl 增量合并成训练用的 X.npy / y.npy。
#
# 两种触发方式：
#   1. 网页上传 jsonl 到 python/recordings/{normal,cheat}/ 并提交 —— 自动跑；
#   2. 手动触发（Actions → 导入录制数据 → Run workflow）。
#
# 本工作流只负责 jsonl → 特征集，不训练。要出新模型请再跑「重新训练模型」。

on:
  workflow_dispatch:
  push:
    paths:
      - 'python/recordings/**'
      - '.github/workflows/ingest.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      # 特征工程只依赖 numpy，不必装 torch/onnx 那一套
      - name: 安装依赖
        run: pip install numpy

      # 幂等：已合并过的 jsonl 会因特征图完全相同而被去重跳过，
      # 所以重复上传 / 重复触发都不会把样本算重。
      - name: jsonl → 特征图，增量合并进 X.npy / y.npy
        working-directory: python
        run: python merge_recordings.py recordings --data .

      - name: 提交更新后的特征集
        run: |
          git config user.name "llsgllsg"
          git config user.email "151439431+llsgllsg@users.noreply.github.com"
          git add python/X.npy python/y.npy
          if git diff --cached --quiet; then
            echo "没有新样本，X.npy / y.npy 无变化。"
          else
            git commit -m "chore: 导入录制数据，更新特征集"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 汇总
        run: |
          echo "### 当前特征集" >> $GITHUB_STEP_SUMMARY
          python -c "import numpy as np; X = np.load('python/X.npy'); y = np.load('python/y.npy'); print(f'- 样本总数：{len(X)}（正常 {int((y==0).sum())} / 作弊 {int((y==1).sum())}）'); print(f'- 特征图形状：{X.shape}')" >> $GITHUB_STEP_SUMMARY
