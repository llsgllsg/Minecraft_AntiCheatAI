name: 发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: '版本递增类型'
        required: true
        type: choice
        options:
          - minor
          - major
          - hotfix

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 计算新版本号
        id: version
        run: |
          # 当前版本：优先取最新 tag；仓库尚无 tag 时回退到 pom.xml 的版本，
          # 否则会把已有版本当成 1.0.0 重新算出同一个版本号，导致后续提交为空而失败。
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CUR_VER="${LATEST_TAG#v}"
          else
            CUR_VER=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]*)<\/version>.*/\1/')
            echo "仓库尚无 tag，以 pom.xml 版本 ${CUR_VER} 作为基线"
          fi

          CUR_MAJOR=$(echo "$CUR_VER" | cut -d. -f1); CUR_MAJOR=${CUR_MAJOR:-1}
          CUR_MINOR=$(echo "$CUR_VER" | cut -d. -f2); CUR_MINOR=${CUR_MINOR:-0}
          CUR_PATCH=$(echo "$CUR_VER" | cut -d. -f3); CUR_PATCH=${CUR_PATCH:-0}
          echo "当前版本: ${CUR_MAJOR}.${CUR_MINOR}.${CUR_PATCH}"

          BUMP="${{ github.event.inputs.bump_type }}"

          # 如果是 tag 推送（非手动触发），不递增，直接用 tag
          if [ -z "$BUMP" ]; then
            NEW_VER="${CUR_VER}"
          else
            case "$BUMP" in
              major)
                NEW_VER="$((CUR_MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VER="${CUR_MAJOR}.$((CUR_MINOR + 1)).0"
                ;;
              hotfix)
                NEW_VER="${CUR_MAJOR}.${CUR_MINOR}.$((CUR_PATCH + 1))"
                ;;
              *)
                echo "未知的 bump_type: ${BUMP}"; exit 1
                ;;
            esac
          fi

          TAG="v${NEW_VER}"
          echo "新版本: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: 更新 pom.xml 版本号
        run: |
          VER="${{ steps.version.outputs.version }}"
          CUR_POM=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]*)<\/version>.*/\1/')
          if [ "$VER" = "$CUR_POM" ]; then
            echo "pom.xml 已是 ${VER}，无需写入版本号"
            exit 0
          fi
          # 根 pom.xml 的 project 版本（第一个 <version>）
          sed -i "0,/<version>[^<]*<\/version>/{s/<version>[^<]*<\/version>/<version>${VER}<\/version>/}" pom.xml

          # 子模块 <parent><version> 必须与父 POM 一致，否则 Maven 解析不到父 POM、
          # 整个构建直接失败（子模块自身不再声明 <version>，版本由父 POM 继承）。
          for child in AntiCheat/pom.xml recorder-plugin/pom.xml; do
            sed -i "/<parent>/,/<\/parent>/{s|<version>[^<]*</version>|<version>${VER}</version>|;}" "$child"
          done

          # plugin.yml
          sed -i "s/^version: .*/version: ${VER}/" AntiCheat/src/main/resources/plugin.yml

      - name: 提交版本变更并打 tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pom.xml AntiCheat/pom.xml recorder-plugin/pom.xml AntiCheat/src/main/resources/plugin.yml
          if git diff --cached --quiet; then
            echo "版本号无变化，跳过提交"
          else
            git commit -m "release: bump version to ${TAG}"
          fi

          # tag 已存在（tag 推送触发时）不重复创建
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在，跳过创建"
          else
            git tag "${TAG}"
          fi

          # tag 推送触发时为 detached HEAD，此时只推 tag
          if [ "${GITHUB_REF_TYPE:-branch}" = "branch" ]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git push origin --tags

      - name: 构建全部模块
        run: mvn -B clean package

      - name: 校验产物
        run: |
          test -f AntiCheat/target/DeepGuard.jar
          test -f recorder-plugin/target/BehaviorRecorder.jar
          test -f AntiCheat/src/main/resources/scaffold_detector.onnx

          # 训练曲线 / 训练报告由「重新训练模型」工作流产出并提交；
          # 尚未训练过时只提示，不因此让发布失败。
          for f in python/training_curves.png python/training_report.md; do
            if [ -f "$f" ]; then
              echo "找到训练产物: $f"
            else
              echo "::warning::缺少训练产物 $f，本次 Release 不会附带（请先运行「重新训练模型」工作流）"
            fi
          done

      # ------------------------------------------------------------------
      # 模组加载器版本（Fabric / NeoForge）：需要 JDK 25（Minecraft 26.2 的字节码
      # 目标），与上面 Maven 用的 JDK 21 并存 —— setup-java 调两次，后一次覆盖 JAVA_HOME。
      # ------------------------------------------------------------------
      - name: 设置 JDK 25（Fabric / NeoForge 用）
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('fabric/**/*.gradle', 'fabric/gradle.properties', 'fabric/gradle/wrapper/gradle-wrapper.properties', 'neoforge/**/*.gradle', 'neoforge/gradle.properties', 'neoforge/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # fabric/build.gradle 的版本号直接读根 pom.xml，而上面「更新 pom.xml 版本号」
      # 已经把新版本写进去了，所以这里天然对齐，不需要额外同步。
      - name: 构建 Fabric 模组
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: 校验 Fabric 产物
        run: |
          ls -la fabric/build/libs/
          if [ -z "$(ls -1 fabric/build/libs/DeepGuard-Fabric-*.jar 2>/dev/null)" ]; then
            echo "::error::未生成 Fabric 模组 jar"
            exit 1
          fi

      # neoforge/build.gradle 同样直接读根 pom.xml 拿版本号。
      # 注意 NeoForge 走的是 NeoForm 管线，首次构建要下载并处理 MC 产物，比 Fabric 慢。
      - name: 构建 NeoForge 模组
        working-directory: neoforge
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: 校验 NeoForge 产物
        run: |
          ls -la neoforge/build/libs/
          if [ -z "$(ls -1 neoforge/build/libs/DeepGuard-NeoForge-*.jar 2>/dev/null)" ]; then
            echo "::error::未生成 NeoForge 模组 jar"
            exit 1
          fi

      - name: 生成详细 Release Notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # 找到上一个 tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "${PREV_TAG}" = "${TAG}" ] || [ -z "${PREV_TAG}" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi

          # 按 conventional commits 前缀分类
          FEATURES=""
          FIXES=""
          ARCH=""
          OTHERS=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            prefix=$(echo "$line" | grep -oE '^(feat|fix|refactor|perf|style|docs|test|build|ci|chore)(\(.+\))?' | head -1)
            case "$prefix" in
              feat*)                FEATURES="${FEATURES}\n- ${line}" ;;
              fix*)                 FIXES="${FIXES}\n- ${line}" ;;
              refactor*|perf*)      ARCH="${ARCH}\n- ${line}" ;;
              *)                    OTHERS="${OTHERS}\n- ${line}" ;;
            esac
          done <<< "$(git log --pretty=format:'%s' "${PREV_TAG}..${TAG}" 2>/dev/null || git log --pretty=format:'%s')"

          # 拼装 Notes
          NOTES_FILE=$(mktemp)
          {
            echo "## DeepGuard ${TAG}"
            echo ""
            echo "### 产物说明"
            echo "| 文件 | 说明 |"
            echo "|------|------|"
            echo "| DeepGuard.jar | 主反作弊插件（Paper），放入服务器 plugins/ 目录 |"
            echo "| DeepGuard-Fabric-*.jar | Fabric 服务端模组，放入服务器 mods/ 目录（需 Fabric Loader + Fabric API，Minecraft 26.2） |"
            echo "| DeepGuard-NeoForge-*.jar | NeoForge 服务端模组，放入服务器 mods/ 目录（需 NeoForge 26.2，Minecraft 26.2） |"
            echo "| BehaviorRecorder.jar | 行为录制插件（Paper），用于采集训练数据 |"
            echo "| scaffold_detector.onnx | AI 模型文件（插件启动时也会自动下载） |"
            if [ -f python/training_curves.png ]; then
              echo "| training_curves.png | AI 模型训练曲线 |"
            fi
            if [ -f python/training_report.md ]; then
              echo "| training_report.md | AI 模型训练报告（数据 / 超参数 / 指标） |"
            fi
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### 新功能"
              echo -e "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### Bug 修复"
              echo -e "$FIXES"
              echo ""
            fi

            if [ -n "$ARCH" ]; then
              echo "### 架构 / 重构"
              echo -e "$ARCH"
              echo ""
            fi

            if [ -n "$OTHERS" ]; then
              echo "### 其他变更"
              echo -e "$OTHERS"
              echo ""
            fi

            # 训练曲线 + 训练报告（由「重新训练模型」工作流产出并提交）
            if [ -f python/training_report.md ]; then
              echo "### AI 模型训练结果"
              echo ""
              if [ -f python/training_curves.png ]; then
                echo "![训练曲线](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/training_curves.png)"
                echo ""
              fi
              # 报告自带一级标题，去掉首行后作为本节正文；
              # 二级标题降为四级，避免和 Release Notes 自身的标题同级。
              tail -n +2 python/training_report.md | sed 's/^## /#### /'
              echo ""
            fi

            echo "### 安装与更新"
            echo ""
            echo "**Paper 服务端**：下载 \`DeepGuard.jar\` 放入 \`plugins/\` 目录，重启服务器即可。"
            echo ""
            echo "**Fabric 服务端（Minecraft 26.2）**：需要 Fabric Loader + Fabric API，"
            echo "把 \`DeepGuard-Fabric-*.jar\` 放进 \`mods/\` 目录。"
            echo ""
            echo "**NeoForge 服务端（Minecraft 26.2）**：需要 NeoForge 26.2，"
            echo "把 \`DeepGuard-NeoForge-*.jar\` 放进 \`mods/\` 目录。"
            echo "这是纯服务端 mod，客户端不需要安装。"
            echo ""
            echo "首次启动会自动下载 ONNX 运行时（约 88 MB，仅一次），期间传统检测照常工作，AI 检测稍后启用。"
            echo ""
            echo "如已安装旧版，直接替换 jar 即可；模型会自动更新。"
            echo ""
            echo "### 完整变更列表"
            git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}" 2>/dev/null || git log --pretty=format:'- %s (%h)'
          } > "$NOTES_FILE"

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"

          ASSETS=(
            AntiCheat/target/DeepGuard.jar
            recorder-plugin/target/BehaviorRecorder.jar
            AntiCheat/src/main/resources/scaffold_detector.onnx
          )
          # 模组加载器版本（文件名带版本号，用通配符取）
          for jar in fabric/build/libs/DeepGuard-Fabric-*.jar neoforge/build/libs/DeepGuard-NeoForge-*.jar; do
            if [ -f "$jar" ]; then
              ASSETS+=("$jar")
            else
              echo "::warning::未找到模组 jar: $jar，本次 Release 不会附带"
            fi
          done
          # 训练曲线 / 报告存在才附带（未训练过时不至于让发布失败）
          for extra in python/training_curves.png python/training_report.md; do
            if [ -f "$extra" ]; then
              ASSETS+=("$extra")
            else
              echo "跳过缺失的训练产物: $extra"
            fi
          done

          if gh release create "${TAG}" "${ASSETS[@]}" \
               --title "DeepGuard ${TAG}" \
               --notes-file "${NOTES_FILE}"; then
            echo "Release ${TAG} 创建完成"
          else
            echo "Release 已存在，改为更新产物"
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          fi
