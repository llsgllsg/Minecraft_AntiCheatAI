# 工具链版本 —— 只放版本，不放 mod 版本号。
#
# mod 版本号和 fabric/build.gradle 一样，直接从 ../pom.xml 读 project 版本，
# 让根 pom 保持「唯一真源」。历史上这个仓库正是被多处版本号失同步坑过
# （根 pom / 两个子模块 parent / plugin.yml），所以不再新增第 6 处。

# Minecraft 26.2（2026 年份制版本号，非混淆）
minecraft_version=26.2

# NeoForge：与 Fabric 版对齐，同样落在 26.2 线上
neoforge_version=26.2.0.88

# ModDevGradle（Gradle 侧的 NeoForge 工具链插件）
mdg_version=2.0.148

# ONNX 运行时版本 —— 与 Paper 版 plugin.yml 的 libraries 声明、
# 以及 fabric/gradle.properties 保持同一个版本。
onnxruntime_version=1.17.1
