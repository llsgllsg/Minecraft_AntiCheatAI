# 工具链版本 —— 只放版本，不放 mod 版本号。
#
# mod 版本号刻意不在这里定义：build.gradle 直接从 ../pom.xml 读 project 版本，
# 让根 pom 保持「唯一真源」。历史上这个仓库正是被多处版本号失同步坑过
# （根 pom / 两个子模块 parent / plugin.yml），所以不再新增第 5 处。

# Minecraft 26.2（2026 年份制版本号，非混淆，用 net.fabricmc.fabric-loom 插件）
minecraft_version=26.2

# Fabric Loader / Fabric API
loader_version=0.19.5
fabric_api_version=0.161.0+26.2

# Fabric Loom
loom_version=1.18.2

# 运行时依赖
fpa_version=0.7.0
snakeyaml_version=2.3
onnxruntime_version=1.17.1
