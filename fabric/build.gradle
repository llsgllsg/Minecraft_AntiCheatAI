import groovy.xml.XmlSlurper

plugins {
    // 26.2 是非混淆版本（Mojang 自 26.1 起不再混淆服务端 jar），
    // 所以用非 remap 的 Loom 插件：没有 mappings、没有 modImplementation、没有 remapJar。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.gfish'

// 版本号的唯一真源是仓库根的 pom.xml —— 这里不重复定义，
// 免得又多出一处需要跟 release.yml 同步的地方。
version = new XmlSlurper(false, false).parse(file('../pom.xml')).version.text()

base {
    archivesName = 'DeepGuard-Fabric'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// 平台无关的共享源码。刻意排除 AIInferenceEngine：它引用 ai.onnxruntime，
// 而 onnxruntime 不在本模组的类路径上（运行时下载 + 子类加载器加载）。
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.java.exclude 'com/gfish/anticheat/AIInferenceEngine.java'

// 两个模组共用的适配层（PlayerHandle 实现、移动事件发射器、Mixin、配置读取）。
// 它只依赖 core 与 Mojang 类型，不依赖任何加载器 API，所以 Fabric 与 NeoForge
// 编译的是同一份源码 —— 检测行为由构造保证一致，而不是靠两边各写一遍再对齐。
sourceSets.main.java.srcDir '../mod-common/src/main/java'

// ---- ONNX 桥接 ----
// onnxruntime 有 87 MB（含各平台 native 库），不可能打进模组 jar；而模组的
// 类路径在启动时就固定了，没法事后追加。所以桥接实现单独编成一个 jar 塞进资源，
// 运行时由子类加载器连同下载来的 onnxruntime 一起加载。
//
// ⚠️ 这些类绝不能进主 source set：父加载器一旦先定义了 OnnxAiEngine，它引用的
// ai.onnxruntime 也会按父加载器去解析，而 onnxruntime 只在子加载器里
// → NoClassDefFoundError。
sourceSets {
    bridge {
        java.srcDir '../onnx-bridge/src/main/java'
        // 桥接只认 core.spi 里的接口。把这两个源文件一起编进来、再从 jar 里排除，
        // 是为了让 bridge 的编译**不依赖主 source set 的产物** —— 否则会形成
        // classes → processResources → bridgeJar → bridgeClasses → classes 的环。
        java.srcDir '../core/src/main/java/com/gfish/anticheat/core/spi'
    }
}

dependencies {
    // 只在编译桥接时需要；运行时的 onnxruntime 由 OnnxRuntimeLoader 下载
    bridgeCompileOnly "com.microsoft.onnxruntime:onnxruntime:${onnxruntime_version}"
}

tasks.register('bridgeJar', Jar) {
    dependsOn 'bridgeClasses'
    archiveFileName = 'onnx-bridge.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/onnx')
    from(sourceSets.bridge.output) {
        // 只放桥接自己的类；AiEngine 等 SPI 必须由父加载器定义，
        // 否则子加载器会再定义一份，父类转型时就 ClassCastException
        include 'com/gfish/anticheat/bridge/**'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    // 默认配置的唯一真源是 Paper 模块的 config.yml —— 拷进 jar 的 deepguard/ 下，
    // 运行时首次启动释放到配置目录。三端因此共用同一份默认值，
    // 不会出现"同一个 max-speed 在 Fabric 和 Paper 上不一样"。
    from('../AntiCheat/src/main/resources/config.yml') {
        into 'deepguard'
    }
    // 内置模型：首次启动释放到数据目录，开箱即用，与 Paper 版行为一致
    from('../AntiCheat/src/main/resources/scaffold_detector.onnx') {
        into 'deepguard'
    }
    // ONNX 桥接 jar：运行时会释放到磁盘再加进子类加载器
    dependsOn 'bridgeJar'
    from(layout.buildDirectory.dir('generated/onnx')) {
        into 'deepguard'
    }
}
