import groovy.xml.XmlSlurper

plugins {
    // 26.2 是非混淆版本（Mojang 自 26.1 起不再混淆服务端 jar），
    // 所以用非 remap 的 Loom 插件：没有 mappings、没有 modImplementation、没有 remapJar。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.gfish'

// 版本号的唯一真源是仓库根的 pom.xml —— 这里不重复定义，
// 免得又多出一处需要跟 release.yml 同步的地方。
version = new XmlSlurper(false, false).parse(file('../pom.xml')).version.text()

base {
    archivesName = 'DeepGuard-Fabric'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// 平台无关的共享源码。刻意排除 AIInferenceEngine：它引用 ai.onnxruntime，
// 而 onnxruntime 不在本模组的类路径上（运行时下载 + 子类加载器加载）。
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.java.exclude 'com/gfish/anticheat/AIInferenceEngine.java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
